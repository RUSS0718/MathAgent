name: RiCL Runtime quality

on:
  push:
    branches: [main, develop, research-prototype, runtime-research-loop]
  pull_request:
    branches: [main, develop, research-prototype, runtime-research-loop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked Runtime environment
        run: uv sync --locked --all-groups
      - name: Check formatting and lint
        run: |
          uv run pre-commit run --all-files
          uv run ruff check ricl_runtime tests scripts/check_runtime_docs.py
          uv run python scripts/check_runtime_docs.py
      - name: Run Runtime and Provider tests
        run: uv run python -m unittest discover -s tests
      - name: Check CLI and paired offline fixtures
        run: |
          uv run python -m ricl_runtime --help
          uv run python -m ricl_runtime --problem "Compute 2 + 2." --offline-answer "4" --output-root artifacts/ci-single
          uv run python -m ricl_runtime.experiments --order-seed 17 --output-root artifacts/ci-paired-pilot
