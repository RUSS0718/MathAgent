<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MathAgent · 聊天产物与恢复体验原型</title>
<style>
:root{color-scheme:light;--bg:#f7f8fa;--surface:#fff;--muted:#5b6975;--text:#18232f;--border:#dce2e6;--border-strong:#b7c3cb;--accent:#0f766e;--accent-strong:#095c56;--accent-wash:#e9f5f2;--success:#216442;--success-wash:#edf7f0;--warn:#85520b;--warn-wash:#fff5e4;--danger:#a33131;--danger-wash:#fff0f0;--shadow:0 12px 32px rgba(24,35,47,.10);--radius:10px;--font:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--font)}button,select{font:inherit}button{cursor:pointer}a{color:inherit}.page{min-height:100vh;padding:26px 28px 96px}.intro{max-width:1180px;margin:0 auto 18px}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.intro h1{margin:6px 0 4px;font-size:26px;letter-spacing:-.02em}.intro p{margin:0;color:var(--muted);max-width:80ch}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;max-width:1180px;margin:0 auto 14px;padding:10px 12px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius)}.toolbar label{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:13px}.toolbar select{border:1px solid var(--border-strong);border-radius:7px;padding:7px 9px;background:var(--surface);color:var(--text)}.toolbar .hint{margin-left:auto;color:var(--muted);font-size:12px}.workspace{max-width:1180px;margin:0 auto;min-height:690px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);border-radius:var(--radius);overflow:hidden}.topbar{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border)}.topbar h2{margin:0;font-size:15px}.topbar small{display:block;color:var(--muted);font-size:11px}.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:12px;white-space:nowrap}.badge.ok{color:var(--success);border-color:#a7d0b8;background:var(--success-wash)}.badge.warn{color:var(--warn);border-color:#e4c58d;background:var(--warn-wash)}.badge.danger{color:var(--danger);border-color:#e2aaaa;background:var(--danger-wash)}.icon-btn,.primary,.secondary{border:1px solid var(--border-strong);border-radius:7px;padding:7px 10px;background:var(--surface);color:var(--text)}.icon-btn{padding:5px 9px}.primary{border-color:var(--accent);background:var(--accent);color:#fff}.secondary:hover,.icon-btn:hover{border-color:var(--accent);color:var(--accent-strong)}.primary:hover{background:var(--accent-strong)}.button-row{display:flex;gap:8px;flex-wrap:wrap}.screen{display:grid;min-height:630px}.screen h3{margin:0 0 10px;font-size:13px}.screen p{margin:0}.muted{color:var(--muted)}.label{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}.list{display:grid;gap:8px}.list-item{padding:10px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}.list-item strong{display:block;font-size:13px}.list-item small{display:block;color:var(--muted);margin-top:2px}.progress{height:7px;overflow:hidden;border-radius:99px;background:#e7ecee}.progress span{display:block;height:100%;background:var(--accent);border-radius:inherit}.call-line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}.call-line:last-child{border-bottom:0}.call-line span:last-child{color:var(--muted);text-align:right}.message{padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}.message.user{background:var(--accent-wash);border-color:#b9ddd7}.message-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px;font-size:12px}.message-head span:last-child{color:var(--muted)}.message p{white-space:pre-wrap}.artifact{display:grid;gap:8px;padding:12px;border:1px solid #b9ddd7;border-left:4px solid var(--accent);border-radius:8px;background:#f4fbf9}.artifact h4{margin:0;font-size:13px}.artifact p{color:#28474a;font-size:13px}.artifact .artifact-meta{display:flex;flex-wrap:wrap;gap:6px;color:var(--muted);font-size:11px}.action-card{display:grid;gap:9px;padding:12px;border:1px solid #e4c58d;border-left:4px solid #bd7b13;border-radius:8px;background:var(--warn-wash)}.action-card h4{margin:0;font-size:13px;color:var(--warn)}.action-card p{color:#604315;font-size:13px}.action-card .button-row{margin-top:2px}.timeline{display:grid;gap:0}.timeline-row{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:start;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}.timeline-dot{width:9px;height:9px;margin-top:5px;border-radius:50%;background:var(--accent)}.timeline-dot.warn{background:#bd7b13}.timeline-dot.danger{background:var(--danger)}.timeline-row strong{display:block;font-size:12px}.timeline-row small{color:var(--muted)}.timeline-row time{color:var(--muted);white-space:nowrap}.scenario-note{max-width:1180px;margin:10px auto 0;color:var(--muted);font-size:12px}.bottom-switcher{position:fixed;z-index:5;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:7px 10px;border:1px solid #465660;background:#1d2a33;color:#fff;border-radius:999px;box-shadow:0 10px 24px rgba(0,0,0,.22)}.bottom-switcher button{border:0;background:transparent;color:#fff;padding:3px 6px;border-radius:5px}.bottom-switcher button:hover{background:rgba(255,255,255,.14)}.bottom-switcher strong{font-size:12px}.variant-note{color:#cbd7dc;font-size:11px}.split{display:grid;gap:16px}.empty{display:grid;place-items:center;min-height:180px;border:1px dashed var(--border-strong);border-radius:8px;color:var(--muted);text-align:center;padding:20px}
/* Variant A: conversation-first workspace */
.variant-a .screen{grid-template-columns:220px minmax(0,1fr) 275px}.variant-a .left,.variant-a .right{padding:16px;background:#fbfcfc}.variant-a .left{border-right:1px solid var(--border)}.variant-a .right{border-left:1px solid var(--border)}.variant-a .center{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.variant-a .center-head{padding:16px;border-bottom:1px solid var(--border)}.variant-a .conversation{display:grid;align-content:start;gap:12px;padding:18px;overflow:auto}.variant-a .composer{display:grid;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}.variant-a .composer textarea{min-height:50px;resize:vertical;border:1px solid var(--border-strong);border-radius:7px;padding:8px}.variant-a .progress-block{display:grid;gap:6px;margin-bottom:18px}.variant-a .progress-line{display:flex;justify-content:space-between;font-size:12px}.variant-a .artifact{margin-top:2px}
/* Variant B: obligation ledger */
.variant-b .screen{grid-template-columns:285px minmax(0,1fr)}.variant-b .ledger{padding:18px;background:#fbfcfc;border-right:1px solid var(--border)}.variant-b .main{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.variant-b .main-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-bottom:1px solid var(--border)}.variant-b .answer{display:grid;align-content:start;gap:12px;padding:20px;overflow:auto}.variant-b .answer .message{max-width:760px}.variant-b .footer{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--border)}.obligation{display:grid;grid-template-columns:17px 1fr auto;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid var(--border)}.obligation .mark{width:12px;height:12px;border:2px solid var(--border-strong);border-radius:50%;margin-top:4px}.obligation.done .mark{border-color:var(--accent);background:var(--accent)}.obligation.pending .mark{border-color:#bd7b13}.obligation strong{font-size:12px}.obligation small{display:block;color:var(--muted);margin-top:2px}.obligation b{font-size:11px;color:var(--muted);font-weight:600}.review-strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
/* Variant C: operations timeline */
.variant-c .screen{grid-template-columns:minmax(0,1fr) 310px}.variant-c .main{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.variant-c .main-head{padding:18px 20px;border-bottom:1px solid var(--border)}.variant-c .feed{display:grid;align-content:start;gap:12px;padding:18px 20px;overflow:auto}.variant-c .aside{display:grid;align-content:start;gap:18px;padding:18px;border-left:1px solid var(--border);background:#fbfcfc}.variant-c .footer{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 20px;border-top:1px solid var(--border)}.variant-c .feed .message{max-width:760px}.variant-c .event-card{padding:12px;border:1px solid var(--border);border-radius:8px}.variant-c .event-card h4{margin:0 0 6px;font-size:12px}.variant-c .event-card ul{padding-left:18px;margin:0;color:var(--muted);font-size:12px}
@media(max-width:900px){.page{padding:18px 12px 92px}.variant-a .screen,.variant-b .screen,.variant-c .screen{grid-template-columns:1fr}.variant-a .left,.variant-a .right,.variant-b .ledger,.variant-c .aside{border:0;border-bottom:1px solid var(--border)}.variant-a .left{order:2}.variant-a .center{order:1}.variant-a .right{order:3}.variant-c .aside{order:2}.variant-c .main{order:1}.toolbar .hint{width:100%;margin-left:0}.workspace{min-height:0}.screen{min-height:0}}
</style>
</head>
<body>
<div class="page">
  <section class="intro">
    <div class="eyebrow">Throwaway prototype · Wayfinder #138</div>
    <h1>聊天产物、真实进度与独立答案交付</h1>
    <p>这个原型只回答一个问题：复杂数学运行中，用户能否看懂“现在完成了什么、哪里失效、下一步能做什么”，并在整理失败或连接中断时拿到原始已审查答案。没有真实 API、数据库或隐藏推理。</p>
  </section>
  <section class="toolbar" aria-label="原型控制">
    <label>场景 <select id="scenario"><option value="normal">正常多步</option><option value="rollback">证据失效回退</option><option value="reconnect">浏览器重连</option><option value="unknown">上游结果未知</option><option value="style-fail">样式整理失败</option><option value="expired">Run 已到期</option></select></label>
    <button class="secondary" id="reset">重置场景</button>
    <button class="secondary" id="step">推进一步</button>
    <button class="secondary" id="freeAction">模拟公开动作</button>
    <span class="hint">也可以用底部切换条比较三种布局</span>
  </section>
  <div id="app"></div>
  <p class="scenario-note" id="scenarioNote"></p>
</div>
<div class="bottom-switcher" aria-label="原型布局切换"><button id="prev" aria-label="上一个布局">←</button><strong id="variantLabel"></strong><span class="variant-note">可分享 URL</span><button id="next" aria-label="下一个布局">→</button></div>
<script>
const variants={
  A:{name:'对话优先',note:'中心保留原始答案，左右面板补充进度与运行观察'},
  B:{name:'义务台账',note:'先看根义务覆盖，再看答案和独立审查状态'},
  C:{name:'运行时间线',note:'先看事件与恢复动作，再展开答案和产物'}
};
const scenarioMeta={
  normal:{label:'正常多步',note:'观察：多次角色调用被归并到可理解的产物；根义务从 1/4 推进到 4/4 后才进入整题审查。'},
  rollback:{label:'证据失效回退',note:'观察：一条依赖被撤回后，相关根义务覆盖数下降；无关成果保留，界面给出具体重审动作。'},
  reconnect:{label:'浏览器重连',note:'观察：重连只补事件并拉权威快照，不创建新的求解调用；用户能继续查看同一 Run。'},
  unknown:{label:'上游结果未知',note:'观察：未知结果进入待复核；界面不把它显示成失败，也不自动重发，等待用户显式决定。'},
  'style-fail':{label:'样式整理失败',note:'观察：/teach 或 /report 失败时，原始已审查答案仍可直接交付，派生样式单独标记失败。'},
  expired:{label:'Run 已到期',note:'观察：整理请求不重新求解；如果已有原始答案，则提供原答案，否则明确显示未完成。'}
};
let variant=new URL(location.href).searchParams.get('variant')||'A';
let scenario=new URL(location.href).searchParams.get('scenario')||'normal';
if(!variants[variant])variant='A'; if(!scenarioMeta[scenario])scenario='normal';
let state;
function baseState(){return{step:0,covered:1,total:4,status:'运行中',stage:'solving',planLabel:'P1',notice:'Reasoner 已提交一条可审查的递推成果。',calls:[['Explore','已完成','发现 Pell 递推结构'],['Planner','已完成','生成 3 个工作块'],['Reasoner · 调用 1','已完成','提交递推成果 L2'],['Reasoner · 调用 2','进行中','继续构造完整性论证']],obligations:[['范围内解列表','done','已提交'],['完整性证明','pending','待核验'],['指定整除子集','pending','未提交'],['输出格式','pending','待最终绑定']],events:[['13:04','Planner','计划版本 P1 已冻结','ok'],['13:06','Reasoner · 调用 1','新增相关引理 L2','ok'],['13:07','Reasoner · 调用 2','继续完整性论证','ok'],['13:08','Step Verifier','局部成果待整题交叉核验','ok']],answer:'已得到范围内的候选解结构，并保留了后续完整性核验所需的递推依据。',artifact:'递推成果 L2',artifactDetail:'支持“范围内解列表”义务；来源：Reasoner / checkpoint 02。',recovery:null,derived:null}};
function applyScenario(){state=baseState(); if(scenario==='normal'){state.step=3;state.covered=3;state.notice='3/4 根义务已有可审查证据；收尾资源已预留，继续完成最后一项。';state.calls=[['Explore','已完成','发现 Pell 递推结构'],['Planner','已完成','生成 3 个工作块 · 计划 P1'],['Reasoner · 调用 1','已完成','提交递推成果 L2'],['Reasoner · 调用 2','已完成','提交完整性论证'],['Step Verifier','已完成','审查列表、完整性与筛选义务']];state.obligations=[['范围内解列表','done','已审查满足'],['完整性证明','done','已审查满足'],['指定整除子集','done','已审查满足'],['输出格式','pending','待最终绑定']];state.events.push(['13:10','Step Verifier','3/4 根义务已审查满足；输出格式仍待处理','ok']);state.answer='范围内的候选解、完整性论证和指定筛选结果已有可审查证据；输出格式仍待绑定。';state.artifact='完整性论证';state.artifactDetail='支持“无遗漏”义务；来源：Reasoner · 调用 2 / ProofAttempt 04。'}
if(scenario==='rollback'){state.step=4;state.covered=2;state.status='需要重审';state.stage='verifying';state.planLabel='P1 → P2';state.notice='完整性论证依赖的假设 H1 已撤回；相关义务回退 1 项。';state.obligations=[['范围内解列表','done','已审查满足'],['完整性证明','pending','证据失效，需重审'],['指定整除子集','done','已审查满足'],['输出格式','pending','等待最终答案']];state.events=[['13:04','Planner','计划版本 P1 已冻结','ok'],['13:06','Reasoner','提交完整性论证，依赖 H1','ok'],['13:09','Verifier','H1 与原题定义域不一致','danger'],['13:10','Controller','覆盖数 3 → 2；新计划 P2 只重开受影响工作','warn']];state.artifact='失效通知';state.artifactDetail='H1 已失效；相关 ProofAttempt 和完整性义务不可直接复用。无关的解列表与筛选成果保留。';state.recovery={title:'下一步：重建完整性证明',detail:'原动作被阻止，选择局部修复或更换路线。'};}
if(scenario==='reconnect'){state.step=5;state.covered=3;state.status='已恢复观察';state.stage='verifying';state.notice='浏览器已重连到同一 Job；事件补齐后正在读取权威快照。';state.calls=[['Explore','已完成','同一调用记录'],['Planner','已完成','同一计划版本 P1'],['Reasoner','已完成','同一 checkpoint 02'],['Whole Verifier','进行中','重连后继续观察']];state.events=[['13:04','Planner','计划版本 P1 已冻结','ok'],['13:06','Reasoner','checkpoint 02 已持久化','ok'],['13:08','Browser','SSE 断开，未创建新请求','warn'],['13:09','Browser','补事件并读取 Job revision 7','ok']];state.recovery={title:'同一 Run 已恢复',detail:'本次重连增加的求解调用：0；可以继续查看事件或等待最终审查。'};}
if(scenario==='unknown'){state.step=4;state.covered=2;state.status='待复核';state.stage='needs_review';state.notice='上游响应无法证实，保留原 attempt 和预算预留；系统没有自动重发。';state.calls=[['Explore','已完成','已有成果可复用'],['Planner','已完成','计划版本 P1'],['Reasoner','结果未知','未确认是否完成'],['Step Verifier','未派发','等待用户决定']];state.events=[['13:04','Planner','计划版本 P1 已冻结','ok'],['13:06','Reasoner','请求已发出，回包未知','danger'],['13:07','Controller','保留 unknown_outcome，不自动重发','warn']];state.artifact='待复核记录';state.artifactDetail='未知结果不会成为新证据，也不会被当作失败；需用户显式选择是否创建新调用身份重试。';state.recovery={title:'需要用户决定',detail:'可继续查看已有成果，或显式重试未知动作。'};}
if(scenario==='style-fail'){state.step=6;state.covered=4;state.status='已完成';state.stage='terminal';state.notice='原始答案已通过整题审查；/report 整理失败，但不影响原答案交付。';state.obligations.forEach(item=>{item[1]='done';item[2]='已审查满足'});state.calls=[['Whole Verifier','已完成','整题审查通过'],['Final Binding','已完成','原始答案已绑定'],['/report','失败','派生样式生成失败']];state.events=[['13:04','Whole Verifier','全部根义务满足','ok'],['13:06','Final Binding','原始答案绑定 answer@7','ok'],['13:07','/report','整理失败，原始答案可交付','warn']];state.artifact='原始已审查答案';state.artifactDetail='answer@7 · 可直接下载/复制；独立于失败的派生报告。';state.derived={title:'/report 失败',detail:'派生样式没有生成。可以稍后重试整理，不会重新求解。'};state.answer='原始答案已完成整题审查并绑定。报告样式整理失败，但不影响这份答案的可交付性。';}
if(scenario==='expired'){state.step=7;state.covered=4;state.status='已完成';state.stage='terminal';state.notice='原 Run 已到期；已有原始答案可交付，新的整理请求不重新求解。';state.obligations.forEach(item=>{item[1]='done';item[2]='已审查满足'});state.calls=[['Whole Verifier','已完成','整题审查通过'],['Final Binding','已完成','原始答案已绑定'],['/teach','未执行','Run 已到期，仅允许读取既有产物']];state.events=[['13:04','Whole Verifier','全部根义务满足','ok'],['13:06','Final Binding','原始答案绑定 answer@7','ok'],['13:12','/teach','请求到达时 Run 已到期','warn']];state.artifact='原始已审查答案';state.artifactDetail='answer@7 · 原 Run 已到期仍可读取；不新增模型调用。';state.derived={title:'/teach 未执行',detail:'整理需要新 Run 或显式重新授权；当前动作不会偷偷重启求解。'};state.answer='原始答案已完成整题审查并绑定。Run 已到期，当前只交付既有答案。';}}
function setUrl(){const u=new URL(location.href);u.searchParams.set('variant',variant);u.searchParams.set('scenario',scenario);history.replaceState({},'',u);}
function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function badge(status){const cls=status==='已完成'||status==='已审查满足'||status==='已恢复观察'?'ok':status==='失败'||status==='结果未知'||status==='需要重审'||status==='待复核'?'danger':status==='进行中'||status==='待核验'||status==='未提交'||status==='等待最终答案'?'warn':'';return `<span class="badge ${cls}">${esc(status)}</span>`}
function obligations(){return state.obligations.map(([title,kind,detail])=>`<div class="obligation ${kind}"><span class="mark"></span><div><strong>${esc(title)}</strong><small>${esc(detail)}</small></div><b>${kind==='done'?'完成':'待处理'}</b></div>`).join('')}
function calls(){return state.calls.map(([role,status,detail])=>`<div class="call-line"><span><strong>${esc(role)}</strong><br><small>${esc(detail)}</small></span><span>${badge(status)}</span></div>`).join('')}
function events(){return state.events.map(([time,role,detail,kind])=>`<div class="timeline-row"><span class="timeline-dot ${kind==='danger'?'danger':kind==='warn'?'warn':''}"></span><div><strong>${esc(role)}</strong><small>${esc(detail)}</small></div><time>${esc(time)}</time></div>`).join('')}
function commonHeader(){return `<div class="topbar"><div><h2>整数解结构与完整性证明</h2><small>Run run_demo_07 · Revision ${state.step+4} · 计划 ${esc(state.planLabel)}</small></div><div class="button-row">${badge(state.stage==='terminal'?'已完成':state.status)} <button class="icon-btn" data-action="toggleInspector">运行观察</button></div></div>`}
function artifact(){return state.artifact?`<div class="artifact"><h4>${esc(state.artifact)}</h4><p>${esc(state.artifactDetail)}</p><div class="artifact-meta"><span>公开产物</span><span>来源已绑定</span><span>可展开原文</span></div></div>`:''}
function actionCard(){if(!state.recovery&&!state.derived)return '';const item=state.recovery||state.derived;return `<div class="action-card"><h4>${esc(item.title)}</h4><p>${esc(item.detail)}</p><div class="button-row"><button class="primary" data-action="primaryRecovery">${state.recovery?'查看恢复动作':'交付原始答案'}</button><button class="secondary" data-action="secondaryRecovery">${state.recovery?'暂不重试':'稍后重试整理'}</button></div></div>`}
function variantA(){return `<div class="workspace variant-a">${commonHeader()}<div class="screen"><aside class="left"><h3>会话与进度</h3><div class="progress-block"><div class="progress-line"><span>根义务覆盖</span><strong>${state.covered}/${state.total}</strong></div><div class="progress"><span style="width:${state.covered/state.total*100}%"></span></div><small class="muted">辅助成果不单独刷进度</small></div><div class="list"><div class="list-item"><strong>当前工作</strong><small>${esc(state.notice)}</small></div><div class="list-item"><strong>活动调用</strong><small>${state.calls.filter(x=>x[1]==='进行中').length} 个角色正在工作</small></div></div></aside><section class="center"><div class="center-head"><div class="label">公开产物流</div><p class="muted">同一角色的多次调用按 Run 和产物身份归并显示。</p></div><div class="conversation"><div class="message user"><div class="message-head"><strong>用户题目</strong><span>原题完整保留</span></div><p>求范围内全部正整数解，证明没有遗漏，标记指定整除子集，并按约定格式输出。</p></div><div class="message"><div class="message-head"><strong>Reasoner · checkpoint 02</strong><span>公开摘要</span></div><p>${esc(state.answer)}</p></div>${artifact()}${actionCard()}</div><div class="composer"><div class="muted">${esc(state.notice)}</div><div class="button-row"><button class="primary" data-action="primaryRecovery">${state.recovery?'处理恢复':'查看运行详情'}</button><button class="secondary" data-action="secondaryRecovery">${state.derived?'重试整理':'展开证据'}</button></div></div></section><aside class="right"><h3>调用与验证</h3>${calls()}<div style="height:12px"></div><h3>最近事件</h3><div class="timeline">${events()}</div></aside></div></div>`}
function variantB(){return `<div class="workspace variant-b">${commonHeader()}<div class="screen"><aside class="ledger"><div class="review-strip">${badge(`${state.covered}/${state.total} 根义务`)}</div><h3>题目义务台账</h3><p class="muted">完成数只来自根义务证据；回退会立即下降。</p><div style="height:12px"></div>${obligations()}<div style="height:16px"></div><h3>当前动作</h3><p class="muted">${esc(state.notice)}</p></aside><section class="main"><div class="main-head"><div><div class="label">独立答案交付</div><strong>${state.stage==='terminal'?'原始答案可交付':'答案仍在审查'}</strong></div>${badge(state.stage==='terminal'?'已绑定':'审查中')}</div><div class="answer"><div class="message"><div class="message-head"><strong>原始答案 · answer@7</strong><span>不含隐藏推理</span></div><p>${esc(state.answer)}</p></div>${artifact()}${actionCard()}<div class="list-item"><strong>最终审查边界</strong><small>完整原题、全部根义务、跨义务假设和实际交付文本必须一起核验。局部通过不直接升级为整题通过。</small></div></div><div class="footer"><span class="muted">${esc(state.notice)}</span><div class="button-row"><button class="primary" data-action="primaryRecovery">${state.stage==='terminal'?'交付原始答案':'查看缺口'}</button><button class="secondary" data-action="secondaryRecovery">${state.recovery?'创建新调用身份':'打开验证历史'}</button></div></div></section></div></div>`}
function variantC(){return `<div class="workspace variant-c">${commonHeader()}<div class="screen"><section class="main"><div class="main-head"><div class="label">Run 事件时间线</div><h3 style="margin:4px 0 0">从调用、回执到交付的公开状态</h3></div><div class="feed"><div class="event-card"><h4>当前状态</h4><p>${esc(state.notice)}</p></div><div class="message"><div class="message-head"><strong>数学结果摘要</strong><span>公开产物</span></div><p>${esc(state.answer)}</p></div>${artifact()}${actionCard()}<div class="event-card"><h4>时间线</h4><div class="timeline">${events()}</div></div></div><div class="footer"><span class="muted">活动角色：${state.calls.filter(x=>x[1]==='进行中').map(x=>x[0]).join('、')||'无'}</span><div class="button-row"><button class="primary" data-action="primaryRecovery">查看下一步</button><button class="secondary" data-action="secondaryRecovery">打开产物</button></div></div></section><aside class="aside"><h3>运行观察</h3><div class="list-item"><strong>阶段</strong><small>${esc(state.stage)}</small></div><div class="list-item"><strong>根义务</strong><small>${state.covered}/${state.total} 已覆盖</small></div><div class="list-item"><strong>调用数</strong><small>${state.calls.length} 条公开调用记录</small></div><div class="list-item"><strong>恢复边界</strong><small>${state.recovery?'等待用户动作':state.stage==='terminal'?'不重新求解':'继续观察'}</small></div><h3>可见调用</h3>${calls()}</aside></div></div>`}
function render(){setUrl();document.getElementById('scenario').value=scenario;document.getElementById('variantLabel').textContent=`${variant} · ${variants[variant].name}`;let content=variant==='A'?variantA():variant==='B'?variantB():variantC();document.getElementById('app').innerHTML=content;document.getElementById('scenarioNote').textContent=scenarioMeta[scenario].note;document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>handleAction(button.dataset.action)));}
function handleAction(action){if(action==='toggleInspector'){variant=variant==='C'?'A':'C';render();return}if(action==='primaryRecovery'){if(state.recovery){state.notice='已打开恢复动作：等待用户显式选择后才创建新调用身份。';}else if(state.derived){state.notice='原始已审查答案已交付；当前不新增模型调用。';}else{state.notice='已打开运行观察，未创建新调用。'}render();return}if(action==='secondaryRecovery'){if(state.recovery){state.notice='已暂不重试，保留未知/失效状态和已有证据。'}else if(state.derived){state.notice='已记录稍后重试整理；原始答案保持可交付。'}else{state.notice='证据面板已展开，原题和公开产物仍保持绑定。'}render();return}}
function advance(){state.step++;if(scenario==='normal'&&state.covered<4){state.covered++;state.obligations[state.covered-1][1]='done';state.obligations[state.covered-1][2]='已审查满足';if(state.covered===4){state.stage='verifying';state.status='整题审查中';state.calls.push(['Whole Verifier','进行中','对照完整原题、组合假设与答案文本']);state.notice='全部根义务满足且收尾资源已预留；现在进入独立整题审查。';state.answer='所有根义务已有可审查证据。整题 Verifier 正在核对完整原题、跨义务假设和实际答案文本；尚未完成交付。';}else{state.notice=`新增相关证据，根义务覆盖 ${state.covered}/${state.total}。`;}state.events.push([`13:${10+state.step}`,'Controller',state.notice,'ok']);}else if(scenario==='normal'&&state.stage==='verifying'){state.stage='terminal';state.status='已完成';state.calls[state.calls.length-1][1]='已完成';state.calls.push(['Final Binding','已完成','原始答案绑定 answer@7']);state.events.push([`13:${10+state.step}`,'Whole Verifier','完整原题核验通过','ok'],[`13:${10+state.step+1}`,'Final Binding','原始答案绑定 answer@7','ok']);state.notice='独立整题审查通过，原始答案文本已绑定并可交付。';state.answer='整题审查与原始答案绑定已完成，可直接交付 answer@7。';}else if(scenario==='rollback'){state.notice='重审动作尚未产生新的相关证据；原样重复已被阻止。';state.events.push([`13:${10+state.step}`,'Controller','连续无进展，等待局部修复或换路线','warn']);}else{state.notice='当前场景没有新的自动推进；请使用公开动作观察边界。';}render()}
function freeAction(){if(scenario==='reconnect'){state.notice='用户点击“继续观察”；系统复用同一 Job，不重新求解。';}else if(scenario==='unknown'){state.notice='用户尚未显式重试；unknown_outcome 保持待复核。';}else if(scenario==='style-fail'||scenario==='expired'){state.notice='公开动作只读取已持久化原始答案，不创建新的求解调用。';}else if(scenario==='rollback'){state.notice='重复原动作被局部阻断；请选择局部修复或替代路线。';}else{state.notice='已记录一次公开查看动作；不改变数学进度。';}render()}
document.getElementById('scenario').addEventListener('change',e=>{scenario=e.target.value;applyScenario();render()});document.getElementById('reset').addEventListener('click',()=>{applyScenario();render()});document.getElementById('step').addEventListener('click',advance);document.getElementById('freeAction').addEventListener('click',freeAction);document.getElementById('prev').addEventListener('click',()=>{variant=variant==='A'?'C':variant==='B'?'A':'B';render()});document.getElementById('next').addEventListener('click',()=>{variant=variant==='C'?'A':variant==='A'?'B':'C';render()});document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName||''))return;if(e.key==='ArrowLeft'){variant=variant==='A'?'C':variant==='B'?'A':'B';render()}if(e.key==='ArrowRight'){variant=variant==='C'?'A':variant==='A'?'B':'C';render()}});applyScenario();render();
</script>
</body>
</html>
