repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(AGENTS\.md|README(\.zh-CN)?\.md|GLOSSARY\.md|docs/README\.md|docs/engineering/(development-gates|runtime-legacy-retirement-inventory)\.md|docs/evals/runtime-.*\.md|tests/test_(runtime.*|deepseek_adapter|minimax_adapter)\.py|scripts/bootstrap\.(ps1|sh)|scripts/check_issues\.py|pyproject\.toml|requirements(-local)?\.txt|uv\.lock|\.pre-commit-config\.yaml|\.github/workflows/quality\.yml)$
      - id: end-of-file-fixer
        files: ^(AGENTS\.md|README(\.zh-CN)?\.md|GLOSSARY\.md|docs/README\.md|docs/engineering/(development-gates|runtime-legacy-retirement-inventory)\.md|docs/evals/runtime-.*\.md|tests/test_(runtime.*|deepseek_adapter|minimax_adapter)\.py|scripts/bootstrap\.(ps1|sh)|scripts/check_issues\.py|pyproject\.toml|requirements(-local)?\.txt|uv\.lock|\.pre-commit-config\.yaml|\.github/workflows/quality\.yml)$
