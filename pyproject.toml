[project]
name = "mathagent"
version = "0.1.0"
description = "RiCL Runtime for mathematical reasoning research"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mpmath==1.3.0",
  "sympy==1.13.3",
]

[dependency-groups]
dev = [
  "pre-commit>=3.7,<5",
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  "artifacts",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
